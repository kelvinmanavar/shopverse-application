{{- $s := .Values.secrets }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccount.name }}
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "secrets.serviceAccount.roleArn is required" $s.serviceAccount.roleArn | quote }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: shopverse-aws-secrets-manager
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "secrets.region is required" $s.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $s.serviceAccount.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopverse-secret
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: shopverse-aws-secrets-manager
  target:
    name: {{ $s.targetName }}
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: {{ required "secrets.rds.secretName is required" $s.rds.secretName | quote }}
        property: {{ $s.rds.usernameProperty }}
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ $s.rds.secretName | quote }}
        property: {{ $s.rds.passwordProperty }}
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ required "secrets.jwt.secretName is required" $s.jwt.secretName | quote }}
        {{- with $s.jwt.property }}
        property: {{ . }}
        {{- end }}
