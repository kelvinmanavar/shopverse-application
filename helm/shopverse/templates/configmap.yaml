apiVersion: v1
kind: ConfigMap
metadata:
  name: shopverse-config
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
data:
  DB_HOST: {{ required "database.host (RDS endpoint) is required" .Values.database.host | quote }}
  DB_PORT: {{ .Values.database.port | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  FRONTEND_ORIGIN: {{ required "backend.frontendOrigin is required" .Values.backend.frontendOrigin | quote }}
