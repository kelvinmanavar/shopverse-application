{{- if .Values.podDisruptionBudget.enabled }}
{{- range $component := list "frontend" "backend" }}
{{- if gt (int (index $.Values $component).replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shopverse-{{ $component }}
  labels:
    {{- include "shopverse.labels" $ | nindent 4 }}
    component: {{ $component }}
spec:
  minAvailable: {{ $.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: shopverse
      component: {{ $component }}
{{- end }}
{{- end }}
{{- end }}
