apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.serviceName }}
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
    component: backend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: http
      protocol: TCP
  selector:
    app: shopverse
    component: backend
