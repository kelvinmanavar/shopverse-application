{{- if .Values.httpRoute.enabled }}
{{- $gw := .Values.httpRoute.gateway }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.httpRoute.name }}
  labels:
    {{- include "shopverse.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ required "httpRoute.gateway.name is required" $gw.name }}
      namespace: {{ required "httpRoute.gateway.namespace is required" $gw.namespace }}
      {{- with $gw.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # API and backend health check -> Go backend
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: Exact
            value: /health
      backendRefs:
        - name: {{ .Values.backend.serviceName }}
          port: {{ .Values.backend.servicePort }}
    # Everything else -> React SPA
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.frontend.serviceName }}
          port: {{ .Values.frontend.servicePort }}
{{- end }}
